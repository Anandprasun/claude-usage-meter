name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Validate manifest
        run: node -e "const m=require('./extension/manifest.json'); if (m.manifest_version!==3) process.exit(1)"
      - name: Unit tests
        run: node --test tests/*.test.js

  statusline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
